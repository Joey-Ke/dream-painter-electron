<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>绘梦师 Dream Painter</title>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <span id="backendStatus">后端：未检测</span>
      <span id="cameraStatus">摄像头：未开启</span>
    </div>

    <div id="mainGrid">
      <section class="panel" id="cameraPanel">
        <div class="panelTitle">绘画画面（摄像头预览）</div>

        <div class="cameraWrap">
          <div class="cameraShellWrap">
            <img id="cameraShell" class="cameraShell" alt="摄像头外壳" />

            <div id="cameraViewport" class="cameraViewport hidden">
              <video id="cameraVideo" autoplay playsinline></video>
              <img id="capturePreview" alt="采集预览" />

              <div id="countdownOverlay" class="hidden">
                <div id="countdownNum">3</div>
              </div>
            </div>
          </div>
        </div>

        <div class="row">
          <select id="cameraSelect" aria-label="选择摄像头"></select>

          <button id="btnStartCamera" class="cuteBtn btn-camera">
            <span class="btnEmoji"></span>
            <span class="btnText">开启摄像头</span>
          </button>

          <button id="btnCapture" class="cuteBtn btn-capture" disabled>
            <span class="btnEmoji"></span>
            <span class="btnText">采集一张</span>
          </button>
        </div>
      </section>

      <section class="panel" id="videoPanel">
        <div class="panelTitle">AI 教学视频</div>

        <div class="videoWrap">
          <div id="videoPlaceholder" class="placeholder">
            <img id="placeholderSlide" alt="作品轮播" />
            <div class="placeholderCaption">
              <div class="phTitle">AI 小画廊</div>
              <div class="phDesc">拍一张照片，生成可以跟画的教学视频。</div>
            </div>
          </div>

          <video id="aiVideo" controls></video>
          <img id="roi" alt="步骤帧预览" class="hidden" />

          <div id="videoOverlay" class="hidden">
            <div class="spinner"></div>
            <div id="overlayText">正在生成教学视频...</div>
          </div>
        </div>

        <div class="stepNav" id="stepNav">
          <button id="btnGenerate" class="cuteBtn btn-generate" disabled>
            <span class="btnEmoji"></span>
            <span class="btnText">开始生成</span>
          </button>

          <button id="btnPrevStep" class="cuteBtn btn-prev hidden" disabled>
            <span class="btnEmoji"></span>
            <span class="btnText">上一步</span>
          </button>

          <button id="btnNextStep" class="cuteBtn btn-next hidden" disabled>
            <span class="btnEmoji"></span>
            <span class="btnText">下一步</span>
          </button>

          <span id="stepIndicator" class="hidden">步骤 0/0</span>

          <button id="btnRegenerate" class="cuteBtn btn-refresh hidden">
            <span class="btnEmoji"></span>
            <span class="btnText">重新生成</span>
          </button>
        </div>

        <div id="sharePanel" class="hidden">
          <div class="shareTitle">本地导出</div>
          <div class="shareButtons">
            <button id="btnSaveImage">保存线稿</button>
            <button id="btnShareWechat">保存海报后手动分享</button>
            <button id="btnShareQQ">保存海报后手动分享</button>
          </div>
        </div>
      </section>
    </div>

    <div id="bottomBar">
      <div id="subtitleBar">准备好了！先开启摄像头并采集一张照片。</div>
      <input id="promptInput" placeholder="（可选）我想学画：小鸭子" />
    </div>

    <div id="modal" class="hidden">
      <div id="modalBox">
        <div id="modalTitle">提示</div>
        <div id="modalMsg"></div>
        <button id="modalOk">确定</button>
      </div>
    </div>
  </div>
</body>
</html>
